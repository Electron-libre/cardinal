# The features of the managed content a project may turn off with `disabled` in the `[cardinal]` table of its
# `.claude/cardinal.toml` (specs/features.md, ADR 0025): `files` are paths under files/, `entries` are managed entries
# of entries/.claude/settings.json as `sync` prints them, `needs` the features it needs (left on while it is).

# The rule against AI attribution, and the checks of `commit-check`, `check-commits`, `check-issue`, the attribution
# warning of `check` and rule `commit-attribution` of `rule-breaches`.
[no-ai-attribution]
files = [".claude/rules/no-ai-attribution.md"]

# The Stop hook that blocks the end of a turn while the project's lint reports a problem (specs/lint-gate.md), for a
# project whose lint runs elsewhere, such as in CI.
[lint-gate]
entries = ["hook Stop cardinal run lint-gate"]

# The hook that formats each edited file (specs/format-hook.md), for a project whose editor formats.
[format-code]
entries = ["hook PostToolUse Edit|Write cardinal run format-code"]

# The Stop hook that sends the agent back when its reply is not in the `user_language` (specs/language-hint.md); rule
# `user-language` of `rule-breaches` still applies, the rule being the user's.
[language-hint]
entries = ["hook Stop cardinal run language-hint"]
